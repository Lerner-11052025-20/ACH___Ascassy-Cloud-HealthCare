    <title>Ascassy Cloud Healthcare — Cloud Healthcare Infrastructure for Modern India</title>
    <!--
      Theme bootstrap — runs before React mounts so the initial paint already
      matches the user's preferred / saved theme. Eliminates the flash of wrong theme.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('ascassy-theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = saved === 'light' || saved === 'dark' ? saved : (prefersDark ? 'dark' : 'light');
          var root = document.documentElement;
          root.classList.toggle('dark', theme === 'dark');
          root.setAttribute('data-theme', theme);
        } catch (e) { /* localStorage unavailable — ignore */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
